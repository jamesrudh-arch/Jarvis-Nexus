; JARVIS NEXUS - JarvisWorld engine configuration (Master Directive Part 5).
; World Partition editor spatial hash: 512 m cells (blueprint world-topology.md 4.2).
; 51200 = 512 m in Unreal units (1 m = 100 UU).

[/Script/Engine.WorldPartitionEditorSpatialHash]
CellSize=51200

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_JarvisTestMap
GameDefaultMap=/Game/Maps/L_JarvisTestMap

[/Script/Engine.RendererSettings]
; Lumen GI + virtual shadow maps + DX12 baseline (UE 5 defaults made explicit).
r.DynamicGlobalIlluminationMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=False
r.D3D12.UseDXC=1
; Extended default luminance range for the avatar's skin sheen PBR (session-7 legacy unreal/ salvage).
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True
bDeveloperMode=True
