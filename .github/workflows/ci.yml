name: CI

# Least-privilege GITHUB_TOKEN (B-04 R4): CI only reads the repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Registry consistency validation
        run: bun tools/registry-validate.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: Integration + scenario tests (offline providers only)
        run: |
          # CI has no owner secrets: live-model tests self-skip (skipIf),
          # echo-provider paths and the bundled MCP server still run.
          bun test tests/integration tests/scenarios tests/persistence

      - name: Adversarial verification gate (V1-V5, incl. V4 evidence provenance)
        run: |
          # Stage 2.2 F-2.2-CI-01: without this step CI stays green even while
          # the repository's own independent verifier is red. The adversarial
          # suite is the release gate; it must run in CI, not only locally.
          bun test tests/adversarial
